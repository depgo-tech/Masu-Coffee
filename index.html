<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MASU SPACE - POS</title>
<link id="favicon" rel="icon" type="image/png" href="">
<style>
:root{--bg:#f0ede5;--bg2:#fff;--sb:#1a3a0a;--sb-d:#0d2005;--sb-h:#2d5a15;--ac:#1a3a0a;--ac-l:#d4e6c4;--gold:#8b6914;--txt:#1a1a1a;--dim:#6b6b6b;--bdr:#e0dccf;--dng:#c75050;--suc:#1a3a0a;--sh:0 1px 4px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--txt);height:100vh;height:100dvh;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
.app{display:flex;height:100vh;height:100dvh}
.sb{width:230px;background:var(--sb);display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s ease, width .2s;z-index:1000}
.sb.col{width:64px}
.sb-h{padding:18px 16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-l{width:42px;height:42px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-weight:800;font-size:18px;color:var(--sb);overflow:hidden}
.sb-l img{width:90%;height:90%;object-fit:contain}
.sb-n{color:#fff;font-size:14px;font-weight:700}
.sb-s{color:rgba(255,255,255,.4);font-size:9px;letter-spacing:2px;text-transform:uppercase}
.sb.col .sb-n,.sb.col .sb-s{display:none}
.sb-m{flex:1;padding:8px 0;overflow-y:auto}
.sb-sec{color:rgba(255,255,255,.3);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:12px 20px 4px}
.sb.col .sb-sec{display:none}
.sb-i{display:flex;align-items:center;gap:12px;padding:12px 20px;color:rgba(255,255,255,.6);cursor:pointer;font-size:13px;font-weight:500;transition:.15s;border-left:3px solid transparent}
.sb-i:hover{background:var(--sb-h);color:#fff}
.sb-i.act{background:rgba(255,255,255,.12);color:#fff;border-left-color:#fff}
.sb-i svg{width:20px;height:20px;flex-shrink:0}
.sb.col .sb-i span{display:none}
.sb.col .sb-i{justify-content:center;padding:12px 0}
.sb-f{padding:10px 20px;border-top:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.3);font-size:10px}
.sb.col .sb-f{display:none}
.sb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none}
.sb-overlay.show{display:block}
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tb{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--bdr);box-shadow:var(--sh);flex-shrink:0}
.tb-l{display:flex;align-items:center;gap:10px}
.tg{width:34px;height:34px;border-radius:8px;background:var(--bg);border:1px solid var(--bdr);cursor:pointer;display:flex;align-items:center;justify-content:center}
.tg svg{width:18px;height:18px}
.pt{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-r{display:flex;align-items:center;gap:12px}
.ab{padding:4px 10px;border-radius:6px;font-size:10px;font-weight:600;display:flex;align-items:center;gap:4px}
.ab.on{background:var(--ac-l);color:var(--sb-d)}
.ab.off{background:#fce0e0;color:var(--dng)}
.ab .dt{width:6px;height:6px;border-radius:50%}
.ab.on .dt{background:var(--suc)}
.ab.off .dt{background:var(--dng)}
.ck{font-size:13px;font-weight:600;text-align:right}
.ck .d{font-size:11px;color:var(--dim);font-weight:400}
.ct{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dash{padding:20px}
.dash h2{font-size:22px;font-weight:700;margin-bottom:2px}
.dash .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
.dash-bn{background:linear-gradient(135deg,var(--sb),var(--sb-d));border-radius:14px;padding:24px;margin-bottom:20px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dash-bn h3{font-size:18px;margin-bottom:4px}
.dash-bn p{font-size:13px;opacity:.7}
.dash-bn button{background:#fff;color:var(--sb);padding:10px 20px;border-radius:8px;font-weight:700;font-size:13px;border:none;cursor:pointer;white-space:nowrap}
.dash-c{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.dash-cd{background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;padding:18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.dash-cd .dl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:6px}
.dash-cd .dv{font-size:22px;font-weight:700;color:var(--sb)}
.dash-cd .ds{font-size:11px;color:var(--dim);margin-top:3px}
.dash-s{margin-bottom:20px}
.dash-s h3{font-size:15px;font-weight:700;margin-bottom:10px}
.dash-t{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;overflow:auto;box-shadow:var(--sh)}
.dash-t table{width:100%;border-collapse:collapse;min-width:400px}
.dash-t th{background:var(--bg);padding:10px 14px;text-align:left;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600;border-bottom:1px solid var(--bdr)}
.dash-t td{padding:10px 14px;border-bottom:1px solid var(--bdr);font-size:13px}
.dash-t tr:hover td{background:var(--bg)}
.qb{display:flex;gap:8px;flex-wrap:wrap}
.qb button{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.qb button svg{width:16px;height:16px}
.qb .b1{background:var(--ac);color:#fff}
.qb .b1:hover{background:var(--sb-d)}
.qb .b2{background:var(--bg2);border:1px solid var(--bdr);color:var(--txt)}
.qb .b2:hover{background:var(--bg)}
.pl{display:flex;height:100%;overflow:hidden;position:relative}
.pl-l{flex:1;display:flex;flex-direction:column;padding:14px;overflow:hidden;min-width:0}
.pl-s{margin-bottom:10px;position:relative}
.pl-s input{width:100%;padding:12px 14px 12px 40px;background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;font-size:16px;box-shadow:var(--sh)}
.pl-s svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}
.ct-tab{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.ct-t{padding:8px 14px;border-radius:16px;cursor:pointer;background:var(--bg2);border:1px solid var(--bdr);color:var(--dim);font-size:12px;font-weight:600;white-space:nowrap;transition:.15s;box-shadow:var(--sh)}
.ct-t:hover{border-color:var(--ac);color:var(--txt)}
.ct-t.act{background:var(--ac);color:#fff;border-color:var(--ac)}
.mg{flex:1;display:flex;flex-wrap:wrap;gap:10px;overflow-y:auto;padding:4px;align-content:flex-start;-webkit-overflow-scrolling:touch}
.mc{width:148px;flex:0 0 148px;background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:10px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:var(--sh)}
.mc:hover{border-color:var(--ac);transform:translateY(-2px)}
.mc .mi{width:64px;height:64px;border-radius:8px;overflow:hidden;margin-bottom:6px;display:flex;align-items:center;justify-content:center}
.mc .mi img{width:100%;height:100%;object-fit:cover}
.mc .mi svg{width:100%;height:100%}
.mc .mn{font-size:12px;font-weight:600;margin-bottom:2px}
.mc .md{font-size:9px;color:var(--dim);margin-bottom:4px;min-height:18px}
.mc .mp{font-size:13px;color:var(--ac);font-weight:700}
.pr{width:350px;background:var(--bg2);border-left:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0}
.pr-h{padding:12px 14px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;gap:10px}
.pr-h h2{font-size:14px;font-weight:700}
.pr-on{background:var(--ac);color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700}
.pr-back{display:none;background:var(--bg);border:1px solid var(--bdr);border-radius:6px;width:32px;height:32px;align-items:center;justify-content:center;cursor:pointer}
.pr-tt{display:flex;padding:10px;gap:6px}
.pr-t{flex:1;padding:8px;border-radius:6px;cursor:pointer;background:var(--bg);border:1px solid var(--bdr);color:var(--dim);font-size:12px;font-weight:600;text-align:center;transition:.15s}
.pr-t.act{background:var(--ac);color:#fff;border-color:var(--ac)}
.pr-ts{padding:0 10px 6px}
.pr-ts select{width:100%;padding:10px;background:var(--bg);border:1px solid var(--bdr);border-radius:6px;font-size:14px}
.pr-oi{flex:1;overflow-y:auto;padding:6px 10px;-webkit-overflow-scrolling:touch}
.pr-o{background:var(--bg);border-radius:8px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;border:1px solid var(--bdr)}
.pr-o .pi{flex:1;min-width:0}
.pr-o .pn{font-size:13px;font-weight:600;margin-bottom:2px}
.pr-o .pv{font-size:10px;color:var(--gold);margin-bottom:4px}
.pr-o .pa{font-size:9px;color:var(--gold);margin-bottom:4px}
.pr-o .pc{display:flex;align-items:center;gap:6px}
.pr-o .qb{width:28px;height:28px;border-radius:4px;background:var(--bg2);border:1px solid var(--bdr);cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pr-o .qb:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.pr-o .qv{min-width:20px;text-align:center;font-weight:600;font-size:13px}
.pr-o .pp{font-weight:700;color:var(--ac);font-size:13px;white-space:nowrap}
.pr-o .px{background:transparent;border:none;color:var(--dng);cursor:pointer;font-size:18px}
.pr-ec{text-align:center;color:var(--dim);padding:30px 10px;font-size:12px}
.pr-f{padding:12px;border-top:1px solid var(--bdr);background:var(--bg)}
.pr-dr{display:flex;gap:4px;margin-bottom:8px}
.pr-di{flex:1;padding:8px 10px;background:var(--bg2);border:1px solid var(--bdr);border-radius:6px;font-size:14px}
.pr-ds{padding:8px 10px;background:var(--bg2);border:1px solid var(--bdr);border-radius:6px;font-size:14px}
.pr-sr{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.pr-sr.t{border-top:1px dashed var(--bdr);margin-top:4px;padding-top:8px;font-size:17px;font-weight:700;color:var(--ac)}
.pr-sr .lb{color:var(--dim)}
.pr-pb{width:100%;padding:14px;margin-top:8px;background:var(--ac);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
.pr-pb:hover:not(:disabled){background:var(--sb-d)}
.pr-pb:disabled{background:var(--bdr);color:var(--dim);cursor:not-allowed}
.pr-hb{width:100%;padding:10px;margin-top:4px;background:transparent;color:var(--dim);border:1px solid var(--bdr);border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.mobile-cart-btn{display:none;position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:var(--ac);color:#fff;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:50;border:none;cursor:pointer}
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px);padding:10px}
.mo.show{display:flex}
.ml{background:var(--bg2);border-radius:14px;padding:20px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,.15);-webkit-overflow-scrolling:touch}
.ml h2{margin-bottom:16px;font-size:18px;display:flex;align-items:center;gap:8px}
.ml h2 svg{width:22px;height:22px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:600}
.fg input,.fg select,.fg textarea{width:100%;padding:12px;background:var(--bg);border:1px solid var(--bdr);border-radius:8px;font-size:16px}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--ac)}
.fr{display:flex;gap:10px}.fr .fg{flex:1}
.vg{margin-bottom:14px}
.vg h4{font-size:11px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.vo{display:flex;flex-wrap:wrap;gap:6px}
.vop{padding:8px 12px;background:var(--bg);border:1px solid var(--bdr);border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:.15s}
.vop:hover{border-color:var(--ac)}
.vop.act{background:var(--ac);color:#fff;border-color:var(--ac)}
.vop .pr2{font-size:10px;color:var(--dim);margin-left:4px}
.vop.act .pr2{color:#d4e6c4}
.al{display:flex;flex-direction:column;gap:4px}
.ai{display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg);border:1px solid var(--bdr);border-radius:6px;cursor:pointer;transition:.15s}
.ai:hover{border-color:var(--ac)}
.ai.ck{background:var(--ac-l);border-color:var(--ac)}
.ai input{accent-color:var(--ac);width:18px;height:18px}
.ai .an{flex:1;font-size:13px;font-weight:500}
.ai .ap{color:var(--ac);font-size:12px;font-weight:600}
.qsel{display:flex;align-items:center;gap:12px;margin:12px 0;justify-content:center}
.qsel button{width:40px;height:40px;border-radius:6px;background:var(--bg);border:1px solid var(--bdr);font-size:18px;cursor:pointer}
.qsel button:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.qsel .val{font-size:20px;font-weight:700;min-width:40px;text-align:center}
.ma{display:flex;gap:8px;margin-top:16px}
.bp{flex:1;padding:12px;background:var(--ac);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.bp:hover{background:var(--sb-d)}
.bs{flex:1;padding:12px;background:var(--bg2);border:1px solid var(--bdr);color:var(--dim);border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.bs:hover{background:var(--bg);color:var(--txt)}
.bd{padding:6px 10px;background:var(--dng);color:#fff;border:none;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer}
.mg-c{padding:20px}
.mg-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.mg-h h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}

/* PERBAIKAN KARTU PRODUK & INVENTORY */
.mg-g{display:flex;flex-wrap:wrap;gap:12px;justify-content:center} /* justify-content center agar rapi di tengah */
.mg-cd{width:180px;flex:0 0 180px;background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:12px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;text-align:center}
.mg-cd .mi{width:80px;height:80px;border-radius:8px;overflow:hidden;margin-bottom:8px;display:flex;align-items:center;justify-content:center} /* Background abu-abu dihapus */
.mg-cd .mi img{width:100%;height:100%;object-fit:cover}
.mg-cd .mi svg{width:100%;height:100%}
.mg-cd .mn{font-size:14px;font-weight:600;margin-bottom:2px;width:100%}
.mg-cd .mc{font-size:10px;color:var(--dim);margin-bottom:6px;width:100%}
.mg-cd .mp{font-size:15px;color:var(--ac);font-weight:700;margin-bottom:8px;width:100%}
.mg-a{display:flex;gap:4px;width:100%}
.mg-a button{flex:1;padding:6px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;border:none}
.mg-a .me{background:var(--ac-l);color:var(--sb-d)}
.mg-a .me:hover{background:var(--ac);color:#fff}
.mg-a .md{background:#fce0e0;color:var(--dng)}
.mg-a .md:hover{background:var(--dng);color:#fff}

.iu{display:flex;gap:10px;align-items:flex-start}
.ip{width:90px;height:90px;border-radius:6px;overflow:hidden;background:var(--bg);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center}
.ip img{width:100%;height:100%;object-fit:cover}
.ip svg{width:80%;height:80%}
.ib{flex:1;display:flex;flex-direction:column;gap:4px}
.ib input{font-size:11px}
.ib input[type=text]{padding:8px;background:var(--bg);border:1px solid var(--bdr);border-radius:4px;font-size:14px}
.tc{padding:20px}
.tg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tcd{background:var(--bg2);border:2px solid var(--bdr);border-radius:10px;padding:16px;cursor:pointer;text-align:center;transition:.15s;box-shadow:var(--sh)}
.tcd:hover{border-color:var(--ac);transform:translateY(-2px)}
.tcd.held{border-color:var(--gold)}
.tcd svg{width:32px;height:32px;margin-bottom:6px}
.tcd.held svg *{stroke:var(--gold)}
.tcd .tn{font-size:14px;font-weight:700}
.tcd .ts{font-size:10px;color:var(--dim);margin-top:2px}
.tcd.held .ts{color:var(--gold);font-weight:600}
.rc{padding:20px}
.rc-c{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.rc-cd{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:16px;box-shadow:var(--sh)}
.rc-cd .lb{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:4px}
.rc-cd .vl{font-size:20px;font-weight:700;color:var(--ac)}
.rc-cd .sb2{font-size:10px;color:var(--dim);margin-top:2px}
.df{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.df input{padding:10px;background:var(--bg2);border:1px solid var(--bdr);border-radius:6px;font-size:14px}
.df button{padding:10px 14px;background:var(--ac);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.tt2{background:var(--bg2);border-radius:10px;overflow:auto;box-shadow:var(--sh)}
.tt2 table{width:100%;border-collapse:collapse;min-width:600px}
.tt2 th{background:var(--bg);padding:10px 12px;text-align:left;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600;border-bottom:1px solid var(--bdr)}
.tt2 td{padding:10px 12px;border-bottom:1px solid var(--bdr);font-size:13px;white-space:nowrap}
.tt2 tr:hover td{background:var(--bg)}
.bg2{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.bg2.dine{background:var(--ac-l);color:var(--sb-d)}
.bg2.take{background:#fff4e0;color:var(--gold)}
.sc{padding:20px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.scd{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:14px;box-shadow:var(--sh)}
.scd .nm{font-size:14px;font-weight:600;margin-bottom:4px}
.scd .sv{font-size:20px;font-weight:700;color:var(--ac)}
.scd .un{font-size:12px;color:var(--dim);margin-left:3px}
.scd.low .sv{color:var(--dng)}
.scd .sa{display:flex;gap:4px;margin-top:8px}
.scd .sa input{flex:1;padding:8px;background:var(--bg);border:1px solid var(--bdr);border-radius:4px;font-size:14px}
.scd .sa button{padding:8px 12px;background:var(--ac);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600}
.set-c{max-width:650px;margin:0 auto;padding:20px}
.set-s{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.set-s h3{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--ac);border-bottom:1px solid var(--bdr);padding-bottom:6px;display:flex;align-items:center;gap:6px}
.set-s h3 svg{width:18px;height:18px}
.set-sv{width:100%;padding:14px;background:var(--ac);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
.set-sv:hover{background:var(--sb-d)}
.acc-c{padding:24px}
.acc-cd{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.acc-cd2{background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;padding:18px;box-shadow:var(--sh);position:relative}
