<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASU SPACE - POS</title>
<style>
  :root{--bg:#f0ede5;--bg2:#fff;--sidebar:#2d5016;--sidebar-dark:#1a3009;--sidebar-hover:#3d6b1f;--accent:#2d5016;--accent-light:#e8f0e0;--gold:#8b6914;--text:#1a1a1a;--dim:#6b6b6b;--border:#e0dccf;--danger:#c75050;--success:#2d5016;--shadow:0 1px 4px rgba(0,0,0,.06)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
  .app{display:flex;height:100vh}
  /* SIDEBAR */
  .sidebar{width:220px;background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
  .sidebar.collapsed{width:60px}
  .sidebar-header{padding:16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
  .sidebar-logo{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-weight:700;font-size:16px;color:var(--sidebar)}
  .sidebar-name{color:#fff;font-size:14px;font-weight:700;letter-spacing:1px}
  .sidebar-sub{color:rgba(255,255,255,.6);font-size:10px;letter-spacing:2px}
  .sidebar.collapsed .sidebar-name,.sidebar.collapsed .sidebar-sub{display:none}
  .sidebar-menu{flex:1;padding:8px 0;overflow-y:auto}
  .sidebar-item{display:flex;align-items:center;gap:12px;padding:12px 20px;color:rgba(255,255,255,.7);cursor:pointer;font-size:14px;font-weight:500;transition:.15s;border-left:3px solid transparent}
  .sidebar-item:hover{background:var(--sidebar-hover);color:#fff}
  .sidebar-item.active{background:rgba(255,255,255,.15);color:#fff;border-left-color:#fff}
  .sidebar-item .ico{font-size:18px;width:24px;text-align:center;flex-shrink:0}
  .sidebar.collapsed .sidebar-item span:not(.ico){display:none}
  .sidebar.collapsed .sidebar-item{justify-content:center;padding:12px 0}
  .sidebar-footer{padding:12px 20px;border-top:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);font-size:11px}
  .sidebar.collapsed .sidebar-footer{display:none}
  /* MAIN */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;background:var(--bg2);border-bottom:1px solid var(--border);box-shadow:var(--shadow);flex-shrink:0}
  .topbar-left{display:flex;align-items:center;gap:12px}
  .toggle-btn{width:32px;height:32px;border-radius:6px;background:var(--bg);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
  .page-title{font-size:18px;font-weight:700}
  .topbar-right{display:flex;align-items:center;gap:12px}
  .api-badge{padding:4px 10px;border-radius:6px;font-size:10px;font-weight:600}
  .api-badge.on{background:var(--accent-light);color:var(--sidebar-dark)}
  .api-badge.off{background:#fce0e0;color:var(--danger)}
  .clock{font-size:13px;font-weight:600;text-align:right}
  .clock .date{font-size:11px;color:var(--dim);font-weight:400}
  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  /* DASHBOARD */
  .dash-container{padding:24px}
  .dash-welcome{font-size:22px;font-weight:700;margin-bottom:4px}
  .dash-sub{color:var(--dim);font-size:14px;margin-bottom:24px}
  .dash-banner{background:linear-gradient(135deg,var(--sidebar),var(--sidebar-dark));border-radius:14px;padding:24px;margin-bottom:24px;color:#fff;display:flex;justify-content:space-between;align-items:center}
  .dash-banner h2{font-size:18px;margin-bottom:4px}
  .dash-banner p{font-size:13px;opacity:.8}
  .dash-banner .banner-btn{background:#fff;color:var(--sidebar);padding:10px 20px;border-radius:8px;font-weight:700;font-size:13px;border:none;cursor:pointer}
  .dash-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .dash-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
  .dash-card .dc-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:8px}
  .dash-card .dc-value{font-size:24px;font-weight:700;color:var(--sidebar)}
  .dash-card .dc-sub{font-size:11px;color:var(--dim);margin-top:4px}
  .dash-card .dc-icon{font-size:28px;float:right;margin-top:-8px}
  .dash-section{margin-bottom:24px}
  .dash-section h3{font-size:16px;font-weight:700;margin-bottom:12px}
  .dash-table{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .dash-table table{width:100%;border-collapse:collapse}
  .dash-table th{background:var(--bg);padding:10px 14px;text-align:left;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600;border-bottom:1px solid var(--border)}
  .dash-table td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
  .dash-table tr:hover td{background:var(--bg)}
  /* POS */
  .pos-layout{display:flex;height:100%;overflow:hidden}
  .pos-left{flex:1;display:flex;flex-direction:column;padding:16px;overflow:hidden}
  .pos-search{margin-bottom:12px;position:relative}
  .pos-search input{width:100%;padding:11px 14px 11px 42px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;font-size:14px;box-shadow:var(--shadow)}
  .pos-search::before{content:'🔍';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px}
  .cat-tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
  .cat-tab{padding:8px 16px;border-radius:20px;cursor:pointer;background:var(--bg2);border:1px solid var(--border);color:var(--dim);font-size:13px;font-weight:600;white-space:nowrap;transition:.15s;box-shadow:var(--shadow)}
  .cat-tab:hover{border-color:var(--accent);color:var(--text)}
  .cat-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .menu-grid{flex:1;display:flex;flex-wrap:wrap;gap:10px;overflow-y:auto;padding:4px;align-content:flex-start}
  .menu-card{width:150px;flex:0 0 150px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:var(--shadow)}
  .menu-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
  .menu-img{width:70px;height:70px;border-radius:8px;overflow:hidden;margin-bottom:6px;background:var(--bg);display:flex;align-items:center;justify-content:center}
  .menu-img img{width:100%;height:100%;object-fit:cover}
  .menu-img svg{width:100%;height:100%}
  .menu-name{font-size:12px;font-weight:600;margin-bottom:2px;line-height:1.2}
  .menu-desc{font-size:9px;color:var(--dim);margin-bottom:4px;min-height:20px}
  .menu-price{font-size:13px;color:var(--accent);font-weight:700}
  .pos-right{width:360px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
  .pos-right-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .pos-right-header h2{font-size:15px;font-weight:700}
  .order-num{background:var(--accent);color:#fff;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:700}
  .type-toggle{display:flex;padding:10px;gap:6px}
  .type-btn{flex:1;padding:8px;border-radius:6px;cursor:pointer;background:var(--bg);border:1px solid var(--border);color:var(--dim);font-size:12px;font-weight:600;text-align:center;transition:.15s}
  .type-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tbl-sel{padding:0 10px 6px}
  .tbl-sel select{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:12px}
  .order-items{flex:1;overflow-y:auto;padding:6px 10px}
  .order-item{background:var(--bg);border-radius:8px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;border:1px solid var(--border)}
  .oi-info{flex:1}
  .oi-name{font-size:12px;font-weight:600;margin-bottom:2px}
  .oi-var{font-size:10px;color:var(--gold);margin-bottom:4px}
  .oi-addons{font-size:9px;color:var(--gold);margin-bottom:4px}
  .oi-ctrl{display:flex;align-items:center;gap:6px}
  .qbtn{width:24px;height:24px;border-radius:4px;background:var(--bg2);border:1px solid var(--border);cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .qbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .qval{min-width:20px;text-align:center;font-weight:600;font-size:12px}
  .oi-price{font-weight:700;color:var(--accent);font-size:12px;white-space:nowrap}
  .oi-rm{background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:18px;padding:0}
  .empty-cart{text-align:center;color:var(--dim);padding:30px 10px;font-size:12px}
  .empty-cart .ico{font-size:40px;margin-bottom:8px;opacity:.2}
  .cart-footer{padding:12px;border-top:1px solid var(--border);background:var(--bg)}
  .disc-row{display:flex;gap:4px;margin-bottom:8px}
  .disc-in{flex:1;padding:7px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-size:12px}
  .disc-sel{padding:7px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-size:12px}
  .sum-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
  .sum-row.total{border-top:1px dashed var(--border);margin-top:4px;padding-top:8px;font-size:17px;font-weight:700;color:var(--accent)}
  .sum-row .lbl{color:var(--dim)}
  .pay-btn{width:100%;padding:12px;margin-top:8px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
  .pay-btn:hover:not(:disabled){background:var(--sidebar-dark)}
  .pay-btn:disabled{background:var(--border);color:var(--dim);cursor:not-allowed}
  .hold-btn{width:100%;padding:8px;margin-top:4px;background:transparent;color:var(--dim);border:1px solid var(--border);border-radius:6px;font-size:11px;font-weight:600;cursor:pointer}
  .hold-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
  .hold-btn:disabled{opacity:.5;cursor:not-allowed}
  /* MODALS */
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
  .modal-overlay.show{display:flex}
  .modal{background:var(--bg2);border-radius:14px;padding:24px;max-width:500px;width:90%;max-height:90vh;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,.15)}
  .modal h2{margin-bottom:16px;font-size:18px}
  .fg{margin-bottom:14px}
  .fg label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:600}
  .fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:14px}
  .fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--accent)}
  .fr{display:flex;gap:10px}.fr .fg{flex:1}
  .vgroup{margin-bottom:16px}
  .vgroup h4{font-size:11px;color:var(--dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .vopts{display:flex;flex-wrap:wrap;gap:6px}
  .vopt{padding:7px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;transition:.15s}
  .vopt:hover{border-color:var(--accent)}
  .vopt.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .vopt .pr{font-size:10px;color:var(--dim);margin-left:4px}
  .vopt.active .pr{color:#e8f0e0}
  .alist{display:flex;flex-direction:column;gap:4px}
  .aitem{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:.15s}
  .aitem:hover{border-color:var(--accent)}
  .aitem.checked{background:var(--accent-light);border-color:var(--accent)}
  .aitem input{accent-color:var(--accent);width:16px;height:16px}
  .aitem .an{flex:1;font-size:12px;font-weight:500}
  .aitem .ap{color:var(--accent);font-size:11px;font-weight:600}
  .qsel{display:flex;align-items:center;gap:12px;margin:12px 0;justify-content:center}
  .qsel button{width:36px;height:36px;border-radius:6px;background:var(--bg);border:1px solid var(--border);font-size:16px;cursor:pointer}
  .qsel button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .qsel .val{font-size:18px;font-weight:700;min-width:36px;text-align:center}
  .m-actions{display:flex;gap:8px;margin-top:16px}
  .btn-p{flex:1;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
  .btn-p:hover{background:var(--sidebar-dark)}
  .btn-s{flex:1;padding:10px;background:var(--bg2);border:1px solid var(--border);color:var(--dim);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
  .btn-s:hover{background:var(--bg);color:var(--text)}
  .btn-d{padding:6px 12px;background:var(--danger);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer}
  /* MGMT */
  .mgmt-container{padding:20px}
  .mgmt-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
  .mgmt-grid{display:flex;flex-wrap:wrap;gap:12px}
  .mgmt-card{width:200px;flex:0 0 200px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .mgmt-card .mi{width:100%;height:80px;border-radius:6px;overflow:hidden;background:var(--bg);margin-bottom:6px;display:flex;align-items:center;justify-content:center}
  .mgmt-card .mi img{width:100%;height:100%;object-fit:cover}
  .mgmt-card .mi svg{width:80%;height:80%}
  .mgmt-card .mn{font-size:13px;font-weight:600;margin-bottom:2px}
  .mgmt-card .mc{font-size:10px;color:var(--dim);margin-bottom:4px}
  .mgmt-card .mp{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:6px}
  .mgmt-actions{display:flex;gap:4px}
  .mgmt-actions button{flex:1;padding:5px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;border:none}
  .mgmt-edit{background:var(--accent-light);color:var(--sidebar-dark)}
  .mgmt-edit:hover{background:var(--accent);color:#fff}
  .mgmt-del{background:#fce0e0;color:var(--danger)}
  .mgmt-del:hover{background:var(--danger);color:#fff}
  .img-up{display:flex;gap:10px;align-items:flex-start}
  .img-prev{width:90px;height:90px;border-radius:6px;overflow:hidden;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
  .img-prev img{width:100%;height:100%;object-fit:cover}
  .img-prev svg{width:80%;height:80%}
  .img-btns{flex:1;display:flex;flex-direction:column;gap:4px}
  .img-btns input{font-size:11px}
  .img-btns input[type=text]{padding:6px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:11px}
  /* TABLES */
  .tbl-container{padding:20px}
  .tbl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
  .tbl-card{background:var(--bg2);border:2px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;text-align:center;transition:.15s;box-shadow:var(--shadow)}
  .tbl-card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .tbl-card.held{border-color:var(--gold)}
  .tbl-ic{font-size:32px;margin-bottom:6px}
  .tbl-nm{font-size:14px;font-weight:700}
  .tbl-st{font-size:10px;color:var(--dim);margin-top:2px}
  .tbl-card.held .tbl-st{color:var(--gold);font-weight:600}
  /* REPORTS */
  .rpt-container{padding:20px}
  .rpt-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .rpt-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
  .rpt-card .lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:6px}
  .rpt-card .val{font-size:20px;font-weight:700;color:var(--accent)}
  .rpt-card .sub{font-size:10px;color:var(--dim);margin-top:2px}
  .date-flt{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
  .date-flt input{padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-size:12px}
  .date-flt button{padding:8px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
  .trans-tbl{background:var(--bg2);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
  .trans-tbl table{width:100%;border-collapse:collapse}
  .trans-tbl th{background:var(--bg);padding:10px 12px;text-align:left;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600;border-bottom:1px solid var(--border)}
  .trans-tbl td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px}
  .trans-tbl tr:hover td{background:var(--bg)}
  .badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
  .badge.dine{background:var(--accent-light);color:var(--sidebar-dark)}
  .badge.take{background:#fff4e0;color:var(--gold)}
  /* STOCK */
  .stk-container{padding:20px}
  .stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .stk-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
  .stk-card .nm{font-size:14px;font-weight:600;margin-bottom:4px}
  .stk-card .sv{font-size:22px;font-weight:700;color:var(--accent)}
  .stk-card .un{font-size:12px;color:var(--dim);margin-left:3px}
  .stk-card.low .sv{color:var(--danger)}
  .stk-actions{display:flex;gap:4px;margin-top:10px}
  .stk-actions input{flex:1;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:12px}
  .stk-actions button{padding:6px 10px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600}
  /* SETTINGS */
  .set-container{max-width:650px;margin:0 auto;padding:20px}
  .set-section{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .set-section h3{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px}
  .set-save{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
  .set-save:hover{background:var(--sidebar-dark)}
  /* RECIPE */
  .rcp-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--border)}
  .rcp-row input{width:50px;padding:3px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;font-size:11px;text-align:center}
  /* RECEIPT */
  .receipt{width:280px;padding:14px;color:#000;font-family:'Courier New',monospace;font-size:11px;line-height:1.4}
  .receipt h3{text-align:center;font-size:14px;margin-bottom:4px}
  .receipt .ra{text-align:center;font-size:10px;margin-bottom:6px}
  .receipt .rd{border-top:1px dashed #000;margin:6px 0}
  .receipt .rr{display:flex;justify-content:space-between;margin:2px 0}
  .receipt .rt{font-weight:700;font-size:13px}
  .receipt .rf{text-align:center;margin-top:6px;font-size:10px}
  /* MISC */
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:var(--dim)}
  .toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:8px;background:var(--success);color:#fff;font-size:13px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:200;transform:translateX(400px);transition:transform .3s}
  .toast.show{transform:translateX(0)}
  .toast.error{background:var(--danger)}
  .empty-st{text-align:center;padding:40px 20px;color:var(--dim)}

      document.getElementById('apiBadge').textContent='● Offline';
      document.getElementById('apiBadge').className='api-badge off';
      return null;
    }
  }).then(function(td){if(td&&!td.error&&Array.isArray(td)&&td.length){tables=td;render()}}).catch(function(){});

}

  event&&event.target&&event.target.closest('.sidebar-item')&&event.target.closest('.sidebar-item').classList.add('active');
  var titles={dashboard:'Dashboard',pos:'Penjualan (Kasir)',produk:'Produk',pembelian:'Pembelian',stok:'Stok & Resep',pelanggan:'Pelanggan',laporan:'Laporan',meja:'Meja',settings:'Pengaturan'};
  document.getElementById('pageTitle').textContent=titles[view]||view;
  render();
}
function render(){
  var c=document.getElementById('content');

  else if(currentView==='produk')renderProduk();
  else if(currentView==='pembelian')renderPembelian();
  else if(currentView==='stok')renderStok();

}

function renderMenuGrid(){var g=document.getElementById('menuGrid');if(!g)return;var s=(document.getElementById('searchIn')?document.getElementById('searchIn').value:'').toLowerCase();var items=menuData.items.filter(function(i){return i.is_active!==false});if(currentCat)items=items.filter(function(i){return i.category_id===currentCat});if(s)items=items.filter(function(i){return i.name.toLowerCase().includes(s)||(i.description||'').toLowerCase().includes(s)});if(!items.length){g.innerHTML='<div class="empty-st"><div class="ico">☕</div>Menu tidak ditemukan</div>';return}g.innerHTML=items.map(function(it){return'<div class="menu-card" onclick="openVariant('+it.id+')"><div class="menu-img">'+getImg(it)+'</div><div class="menu-name">'+it.name+'</div><div class="menu-desc">'+(it.description||'')+'</div><div class="menu-price">'+rp(it.base_price)+'</div></div>'}).join('')}

function openVariant(id){var it=menuData.items.find(function(i){return i.id===id});if(!it)return;mItem=it;mSel={temp:null,size:null,addons:[],qty:1};var vs=menuData.variants.filter(function(v){return v.menu_item_id===id});var tvs=vs.filter(function(v){return v.variant_group==='Temperature'});var svs=vs.filter(function(v){return v.variant_group==='Size'});if(tvs.length)mSel.temp=tvs[0].variant_value;if(svs.length)mSel.size=svs[0].variant_value;var ias=menuData.itemAddons.filter(function(ia){return ia.menu_item_id===id});var ads=ias.map(function(ia){return menuData.addons.find(function(a){return a.id===ia.addon_id})}).filter(Boolean);var h='<div style="text-align:center;margin-bottom:12px"><div style="width:100px;height:100px;margin:0 auto">'+getImg(it)+'</div></div>';if(tvs.length){h+='<div class="vgroup"><h4>Suhu</h4><div class="vopts">';tvs.forEach(function(v){h+='<div class="vopt '+(mSel.temp===v.variant_value?'active':'')+'" onclick="selVar(\'temp\',\''+v.variant_value+'\',this)">'+v.variant_value+(v.price_modifier?'<span class="pr">+'+rp(v.price_modifier)+'</span>':'')+'</div>'});h+='</div></div>'}if(svs.length){h+='<div class="vgroup"><h4>Ukuran</h4><div class="vopts">';svs.forEach(function(v){h+='<div class="vopt '+(mSel.size===v.variant_value?'active':'')+'" onclick="selVar(\'size\',\''+v.variant_value+'\',this)">'+v.variant_value+(v.price_modifier?'<span class="pr">+'+rp(v.price_modifier)+'</span>':'')+'</div>'});h+='</div></div>'}if(ads.length){h+='<div class="vgroup"><h4>Add-ons</h4><div class="alist">';ads.forEach(function(a){h+='<label class="aitem" onclick="togAdd(this,'+a.id+')"><input type="checkbox"><span class="an">'+a.name+'</span><span class="ap">+'+rp(a.price)+'</span></label>'});h+='</div></div>'}document.getElementById('vModalName').textContent=it.name;document.getElementById('vModalContent').innerHTML=h;document.getElementById('mQty').textContent='1';updMTotal();document.getElementById('variantModal').classList.add('show')}
function selVar(t,v,el){if(t==='temp')mSel.temp=v;else mSel.size=v;el.parentNode.querySelectorAll('.vopt').forEach(function(o){o.classList.remove('active')});el.classList.add('active');updMTotal()}
function togAdd(el,id){var cb=el.querySelector('input');cb.checked=!cb.checked;if(cb.checked){mSel.addons.push(id);el.classList.add('checked')}else{mSel.addons=mSel.addons.filter(function(a){return a!==id});el.classList.remove('checked')}updMTotal()}

function calcMUnit(){if(!mItem)return 0;var vs=menuData.variants.filter(function(v){return v.menu_item_id===mItem.id});var p=parseFloat(mItem.base_price);var t=vs.find(function(v){return v.variant_group==='Temperature'&&v.variant_value===mSel.temp});var s=vs.find(function(v){return v.variant_group==='Size'&&v.variant_value===mSel.size});if(t)p+=parseFloat(t.price_modifier);if(s)p+=parseFloat(s.price_modifier);mSel.addons.forEach(function(aid){var a=menuData.addons.find(function(x){return x.id===aid});if(a)p+=parseFloat(a.price)});return p}

function addToCart(){if(!mItem)return;var up=calcMUnit();var ads=mSel.addons.map(function(aid){return menuData.addons.find(function(a){return a.id===aid})}).filter(Boolean);var vs=menuData.variants.filter(function(v){return v.menu_item_id===mItem.id});var vpm=0;var t=vs.find(function(v){return v.variant_group==='Temperature'&&v.variant_value===mSel.temp});var s=vs.find(function(v){return v.variant_group==='Size'&&v.variant_value===mSel.size});if(t)vpm+=parseFloat(t.price_modifier);if(s)vpm+=parseFloat(s.price_modifier);var at=ads.reduce(function(sm,a){return sm+parseFloat(a.price)},0);var adIds=ads.map(function(a){return a.id}).sort();var ex=cart.find(function(c){return c.menu_item_id===mItem.id&&c.variant_temp===mSel.temp&&c.variant_size===mSel.size&&JSON.stringify((c.addons||[]).map(function(a){return a.id}).sort())===JSON.stringify(adIds)});if(ex){ex.quantity+=mSel.qty;ex.subtotal=ex.unit_price*ex.quantity}else{cart.push({menu_item_id:mItem.id,menu_item_name:mItem.name,variant_temp:mSel.temp,variant_size:mSel.size,base_price:parseFloat(mItem.base_price),variant_price:vpm,addon_price:at,unit_price:up,quantity:mSel.qty,subtotal:up*mSel.qty,addons:ads})}closeM('variantModal');renderOrderPanel();toast('Item ditambahkan')}

function renderOrderPanel(){var p=document.getElementById('orderPanel');if(!p)return;var st=cart.reduce(function(s,i){return s+i.subtotal},0);var dv=parseFloat(document.getElementById('discInput')?document.getElementById('discInput').value:0)||0;var dt=document.getElementById('discType')?document.getElementById('discType').value:'amount';var disc=dt==='percent'?st*dv/100:dv;disc=Math.min(disc,st);var ad=st-disc;var tax=ad*parseFloat(settings.tax_rate||0.10);var total=ad+tax;var h='<div class="pos-right-header"><h2>🛒 Order</h2><span class="order-num">#'+orderNum+'</span></div>';h+='<div class="type-toggle"><div class="type-btn '+(orderType==='dine-in'?'active':'')+'" onclick="setOT(\'dine-in\')">🍽️ Dine-in</div><div class="type-btn '+(orderType==='takeaway'?'active':'')+'" onclick="setOT(\'takeaway\')">🥡 Takeaway</div></div>';if(orderType==='dine-in'){h+='<div class="tbl-sel"><select id="tblSelect" onchange="selTbl=this.value"><option value="">-- Pilih Meja --</option>'+tables.map(function(t){return'<option value="'+t.id+'" '+(selTbl==t.id?'selected':'')+'>'+t.name+(t.status==='held'?' (Held)':'')+'</option>'}).join('')+'</select></div>'}h+='<div class="order-items">';if(!cart.length){h+='<div class="empty-cart"><div class="ico">☕</div>Pilih menu untuk memulai</div>'}else{cart.forEach(function(it,idx){var vs=[it.variant_temp,it.variant_size].filter(Boolean).join(' • ');var ads=it.addons?it.addons.map(function(a){return a.name}).join(', '):'';h+='<div class="order-item"><div class="oi-info"><div class="oi-name">'+it.menu_item_name+'</div>'+(vs?'<div class="oi-var">'+vs+'</div>':'')+(ads?'<div class="oi-addons">+ '+ads+'</div>':'')+'<div class="oi-ctrl"><button class="qbtn" onclick="chgQty('+idx+',-1)">−</button><span class="qval">'+it.quantity+'</span><button class="qbtn" onclick="chgQty('+idx+',1)">+</button></div></div><div style="display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between"><button class="oi-rm" onclick="rmItem('+idx+')">×</button><div class="oi-price">'+rp(it.subtotal)+'</div></div></div>'})}h+='</div>';h+='<div class="cart-footer"><div class="disc-row"><input type="number" class="disc-in" id="discInput" placeholder="Diskon" value="'+(dv||'')+'" oninput="renderOrderPanel()"><select class="disc-sel" id="discType" onchange="renderOrderPanel()"><option value="amount" '+(dt==='amount'?'selected':'')+'>Rp</option><option value="percent" '+(dt==='percent'?'selected':'')+'>%</option></select></div>';h+='<div class="sum-row"><span class="lbl">Subtotal</span><span>'+rp(st)+'</span></div>';h+='<div class="sum-row"><span class="lbl">Diskon</span><span style="color:var(--danger)">- '+rp(disc)+'</span></div>';h+='<div class="sum-row"><span class="lbl">Pajak ('+Math.round((settings.tax_rate||0.10)*100)+'%)</span><span>'+rp(tax)+'</span></div>';h+='<div class="sum-row total"><span>Total</span><span>'+rp(total)+'</span></div>';h+='<button class="pay-btn" '+(!cart.length?'disabled':'')+' onclick="openPay('+st+','+disc+','+tax+','+total+')">💳 Bayar</button>';h+='<button class="hold-btn" '+(!cart.length?'disabled':'')+' onclick="holdOrder()">⏸️ Hold Order</button>';h+='</div>';p.innerHTML=h;if(selTbl){var s=document.getElementById('tblSelect');if(s)s.value=selTbl}}
function setOT(t){orderType=t;if(t==='takeaway')selTbl=null;renderOrderPanel()}
function chgQty(i,d){cart[i].quantity+=d;if(cart[i].quantity<=0)cart.splice(i,1);else cart[i].subtotal=cart[i].unit_price*cart[i].quantity;renderOrderPanel()}
function rmItem(i){cart.splice(i,1);renderOrderPanel()}
function holdOrder(){if(!cart.length)return;if(orderType==='dine-in'&&!selTbl){toast('Pilih meja dulu',true);return}var tid=selTbl;var od={cart:cart,orderType:orderType,selectedTableId:selTbl,order_number:orderNum,discount:parseFloat(document.getElementById('discInput').value)||0,discount_type:document.getElementById('discType').value};if(apiOnline)apiP('hold-order',{table_id:tid,order_data:od});var t=tables.find(function(x){return x.id==tid});if(t){t.status='held';t.hold_order=od}cart=[];selTbl=null;orderNum='MS'+Math.floor(Math.random()*90000+10000);renderOrderPanel();toast('Order disimpan')}
function recallOrder(tid){var t=tables.find(function(x){return x.id==tid});if(!t||!t.hold_order){if(apiOnline){apiG('recall-order?table_id='+tid).then(function(r){if(r&&!r.error&&r.hold_order)doRecall(r);else toast('Tidak ada held order',true)})}else toast('Tidak ada held order',true);return}doRecall(t)}

// PAYMENT - langsung proses, tanpa loading
function openPay(st,disc,tax,total){if(!cart.length)return;payT=total;payD={st:st,disc:disc,tax:tax,total:total};document.getElementById('payTotal').textContent=rp(total);document.getElementById('payRecv').value='';document.getElementById('payChange').textContent='Rp 0';document.getElementById('payModal').classList.add('show')}
function setCash(a){document.getElementById('payRecv').value=a;calcChange()}
function calcChange(){var r=parseFloat(document.getElementById('payRecv').value)||0;document.getElementById('payChange').textContent=rp(Math.max(0,r-payT))}
function doPayment(){
  var recv=parseFloat(document.getElementById('payRecv').value)||0;
  if(recv<payT&&document.getElementById('payMethod').value==='cash'){toast('Uang tidak cukup',true);return}
  var method=document.getElementById('payMethod').value;
  var change=Math.max(0,recv-payT);
  var op={order_type:orderType,table_id:orderType==='dine-in'?selTbl:null,table_name:orderType==='dine-in'?(tables.find(function(t){return t.id==selTbl})?tables.find(function(t){return t.id==selTbl}).name:null):null,subtotal:payD.st,discount_value:parseFloat(document.getElementById('discInput').value)||0,discount_type:document.getElementById('discType').value,discount_amount:payD.disc,tax_rate:settings.tax_rate||0.10,tax_amount:payD.tax,total:payD.total,payment_method:method,amount_paid:recv,change_amount:change,status:'completed',created_at:new Date().toISOString()};
  
  // SIMPAN LOKAL DULU - instan
  localOrders.push({order:op,items:cart,order_number:orderNum});
  localStorage.setItem('pos_orders',JSON.stringify(localOrders));
  
  closeM('payModal');
  showReceipt(orderNum,op,cart,change,recv,method);
  
  // Kirim ke API di background
  if(apiOnline){
    var ip=cart.map(function(c){var ic=JSON.parse(JSON.stringify(c));ic.addons=JSON.stringify(c.addons);return ic});
    apiP('order',{order:op,items:ip,table_id:selTbl}).then(function(r){
      if(r&&!r.error)toast('Tersimpan ke server');
      else toast('Disimpan lokal');
    });
  } else {
    toast('Disimpan lokal (offline)');
  }
  
  cart=[];selTbl=null;orderNum='MS'+Math.floor(Math.random()*90000+10000);
  renderOrderPanel();
}

  h+='<div class="rd"></div><div class="rr"><span>Subtotal</span><span>'+rp(order.subtotal)+'</span></div><div class="rr"><span>Diskon</span><span>- '+rp(order.discount_amount)+'</span></div><div class="rr"><span>Pajak ('+tp+'%)</span><span>'+rp(order.tax_amount)+'</span></div><div class="rr rt"><span>TOTAL</span><span>'+rp(order.total)+'</span></div><div class="rd"></div><div class="rr"><span>'+method.toUpperCase()+'</span><span>'+rp(paid)+'</span></div><div class="rr"><span>Kembalian</span><span>'+rp(change)+'</span></div><div class="rd"></div><div class="rf">'+(settings.receipt_footer||'Terima kasih!')+'<br>😊<br><small>www.masuspace.coffee</small></div></div>';

  g.innerHTML=menuData.items.map(function(it){var cat=menuData.categories.find(function(c){return c.id===it.category_id});return'<div class="mgmt-card"><div class="mi">'+getImg(it)+'</div><div class="mn">'+it.name+'</div><div class="mc">'+(cat?cat.name:'')+'</div><div class="mp">'+rp(it.base_price)+'</div><div class="mgmt-actions"><button class="mgmt-edit" onclick="openProduct('+it.id+')">✏️</button><button class="mgmt-del" onclick="delProduct('+it.id+')">🗑️</button></div></div>'}).join('');
}
function openProduct(id){
  editImg='';var sel=document.getElementById('eCat');sel.innerHTML=menuData.categories.map(function(c){return'<option value="'+c.id+'">'+c.name+'</option>'}).join('');
  if(id){var it=menuData.items.find(function(i){return i.id===id});document.getElementById('mModalTitle').textContent='Edit Produk';document.getElementById('eId').value=id;document.getElementById('eName').value=it.name;document.getElementById('eCat').value=it.category_id;document.getElementById('ePrice').value=it.base_price;document.getElementById('eDesc').value=it.description||'';document.getElementById('eImgUrl').value=it.image_url||'';document.getElementById('eActive').value=String(it.is_active!==false);editImg=it.image_data||'';updImgPrev(it)}else{document.getElementById('mModalTitle').textContent='Tambah Produk';document.getElementById('eId').value='';document.getElementById('eName').value='';document.getElementById('ePrice').value='';document.getElementById('eDesc').value='';document.getElementById('eImgUrl').value='';document.getElementById('eActive').value='true';editImg='';updImgPrev({})}
  document.getElementById('menuModal').classList.add('show');

function updImgPrev(it){var p=document.getElementById('imgPrev');if(it.image_data)p.innerHTML='<img src="'+it.image_data+'">';else if(it.image_url)p.innerHTML='<img src="'+it.image_url+'">';else p.innerHTML=getSVG(it)}
function handleUpload(e){var f=e.target.files[0];if(!f)return;if(f.size>500000){toast('Maks 500KB',true);return}var r=new FileReader();r.onload=function(ev){editImg=ev.target.result;updImgPrev({image_data:editImg})};r.readAsDataURL(f)}
function handleUrl(){var u=document.getElementById('eImgUrl').value;if(u)updImgPrev({image_url:u});else updImgPrev({})}
function saveProduct(){
  var id=document.getElementById('eId').value;var name=document.getElementById('eName').value.trim();var catId=parseInt(document.getElementById('eCat').value);var price=parseFloat(document.getElementById('ePrice').value);var desc=document.getElementById('eDesc').value.trim();var imgUrl=document.getElementById('eImgUrl').value.trim();var active=document.getElementById('eActive').value==='true';
  if(!name){toast('Nama wajib',true);return}if(!price||price<=0){toast('Harga invalid',true);return}
  var pl={name:name,category_id:catId,base_price:price,description:desc,image_url:imgUrl,image_data:editImg,is_active:active};
  var p=id?apiU('menu-item/'+id,pl):apiP('menu-item',pl);
  p.then(function(r){if(r&&r.error){toast('Error: '+r.error,true);return}apiG('menu').then(function(d){if(d&&!d.error){menuData=d}closeM('menuModal');renderProduk();toast('Produk disimpan')})});
}
function delProduct(id){if(!confirm('Hapus produk?'))return;apiD('menu-item/'+id).then(function(r){if(r&&r.error){toast('Error',true);return}apiG('menu').then(function(d){if(d&&!d.error)menuData=d;renderProduk();toast('Dihapus')})})}

function openCatModal(){renderCatList();document.getElementById('catModal').classList.add('show')}
function renderCatList(){document.getElementById('catList').innerHTML=menuData.categories.map(function(c){return'<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--bg);border-radius:6px;margin-bottom:4px"><span style="font-size:13px;font-weight:600">'+(c.icon||'☕')+' '+c.name+'</span><button class="btn-d" style="padding:3px 8px;font-size:10px" onclick="delCat('+c.id+')">Hapus</button></div>'}).join('')}
function addCat(){var n=document.getElementById('newCat').value.trim();if(!n){toast('Isi nama',true);return}apiP('categories',{name:n,icon:'☕',sort_order:menuData.categories.length+1}).then(function(r){if(r&&r.error){toast('Error',true);return}apiG('menu').then(function(d){if(d&&!d.error)menuData=d;renderCatList();toast('Ditambah')});document.getElementById('newCat').value=''})}
function delCat(id){if(!confirm('Hapus kategori?'))return;apiD('categories/'+id).then(function(r){if(r&&r.error){toast('Error',true);return}apiG('menu').then(function(d){if(d&&!d.error)menuData=d;renderCatList();toast('Dihapus')})})}

function getLocalIngs(){return[{id:1,name:'Coffee Beans',unit:'g',stock:5000,min_stock:1000},{id:2,name:'Fresh Milk',unit:'ml',stock:8000,min_stock:2000},{id:3,name:'Sugar',unit:'g',stock:3000,min_stock:500},{id:4,name:'Matcha Powder',unit:'g',stock:1000,min_stock:200},{id:5,name:'Tea Leaves',unit:'g',stock:2000,min_stock:500},{id:6,name:'Cup Hot 8oz',unit:'pcs',stock:500,min_stock:100},{id:7,name:'Cup Ice 12oz',unit:'pcs',stock:500,min_stock:100},{id:8,name:'Lid Cup',unit:'pcs',stock:800,min_stock:100},{id:9,name:'Straw',unit:'pcs',stock:1000,min_stock:200},{id:10,name:'Plastic Bag',unit:'pcs',stock:300,min_stock:50},{id:11,name:'Food Box',unit:'pcs',stock:200,min_stock:50},{id:12,name:'Tissue',unit:'pcs',stock:2000,min_stock:500}]}
function doBuy(id){var q=parseFloat(document.getElementById('buy-'+id).value);if(!q||q<=0){toast('Isi qty',true);return}apiP('stock-in',{ingredient_id:id,quantity:q,note:'Pembelian'}).then(function(r){if(r&&r.error)toast('Error',true);else toast('Stok ditambah')});renderPembelian()}

// STOK & RESEP
function renderStok(){
  document.getElementById('content').innerHTML='<div class="stk-container"><h2 style="font-size:20px;font-weight:700;margin-bottom:4px">📋 Stok & Resep</h2><p style="color:var(--dim);font-size:13px;margin-bottom:16px">Kelola stok bahan baku dan resep per menu. Stok berkurang otomatis saat terjual.</p><div style="display:flex;gap:12px;margin-bottom:16px"><button class="btn-p" style="flex:0 0 auto;padding:8px 14px" onclick="showStockTab()">📦 Stok</button><button class="btn-s" style="flex:0 0 auto;padding:8px 14px" onclick="showRecipeTab()">🧪 Resep</button></div><div id="stkContent"></div></div>';
  showStockTab();
}
var stkTab='stock';
function showStockTab(){stkTab='stock';apiG('ingredients').then(function(ings){if(!ings||ings.error||!Array.isArray(ings))ings=getLocalIngs();var el=document.getElementById('stkContent');el.innerHTML='<div class="stk-grid">'+ings.map(function(ing){var low=parseFloat(ing.stock)<=parseFloat(ing.min_stock);return'<div class="stk-card '+(low?'low':'')+'"><div class="nm">'+ing.name+(low?' ⚠️':'')+'</div><div><span class="sv">'+ing.stock+'</span><span class="un">'+ing.unit+'</span></div><div style="font-size:11px;color:var(--dim);margin-top:2px">Min: '+ing.min_stock+' '+ing.unit+'</div><div class="stk-actions"><input type="number" placeholder="Tambah" id="stk-'+ing.id+'"><button onclick="addStk('+ing.id+')">+</button></div></div>'}).join('')+'</div>'})}
function showRecipeTab(){stkTab='recipe';Promise.all([apiG('recipes'),apiG('ingredients')]).then(function(r){var recipes=r[0]&&!r[0].error?r[0]:[];var ings=r[1]&&!r[1].error?r[1]:getLocalIngs();var el=document.getElementById('stkContent');if(!menuData.items.length){el.innerHTML='<div class="empty-st"><div class="ico">📋</div>Belum ada menu</div>';return}el.innerHTML='<div class="mgmt-grid">'+menuData.items.map(function(it){var cat=menuData.categories.find(function(c){return c.id===it.category_id});var ir=recipes.filter(function(r){return r.menu_item_id===it.id});var rh='';if(ir.length){rh=ir.map(function(r){var ing=ings.find(function(i){return i.id===r.ingredient_id});if(!ing)return'';var low=parseFloat(ing.stock)<=parseFloat(ing.min_stock);return'<div style="display:flex;justify-content:space-between;padding:2px 0;font-size:11px"><span>'+ing.name+(low?' ⚠️':'')+'</span><span style="color:'+(low?'var(--danger)':'var(--dim)')+'">'+r.quantity+' '+ing.unit+' ('+ing.stock+')</span></div>'}).join('')}else{rh='<div style="font-size:10px;color:var(--danger)">⚠️ Belum ada resep</div>'}return'<div class="mgmt-card"><div class="mi">'+getImg(it)+'</div><div class="mn">'+it.name+'</div><div class="mc">'+(cat?cat.name:'')+'</div><div style="margin-top:6px;border-top:1px solid var(--border);padding-top:6px"><div style="font-size:10px;font-weight:600;color:var(--dim);margin-bottom:2px">BAHAN:</div>'+rh+'</div><button class="mgmt-edit" style="margin-top:6px;width:100%" onclick="editRecipe('+it.id+')">✏️ Atur</button></div>'}).join('')+'</div>'})}
function addStk(id){var q=parseFloat(document.getElementById('stk-'+id).value);if(!q||q<=0){toast('Isi qty',true);return}apiP('stock-in',{ingredient_id:id,quantity:q,note:'Manual'}).then(function(r){if(r&&r.error)toast('Error',true);else toast('Stok ditambah')});showStockTab()}
function editRecipe(id){var it=menuData.items.find(function(i){return i.id===id});if(!it)return;Promise.all([apiG('recipes'),apiG('ingredients')]).then(function(r){var recipes=r[0]&&!r[0].error?r[0]:[];var ings=r[1]&&!r[1].error?r[1]:getLocalIngs();var ir=recipes.filter(function(r){return r.menu_item_id===id});var h='<div class="modal"><h2>🧪 Resep: '+it.name+'</h2>';h+='<div style="background:var(--bg);border-radius:8px;padding:10px;margin-bottom:10px"><div style="font-size:11px;font-weight:600;color:var(--dim);margin-bottom:6px">Bahan Saat Ini:</div>';if(!ir.length){h+='<div style="color:var(--danger);font-size:12px">Belum ada resep</div>'}else{ir.forEach(function(r){var ing=ings.find(function(i){return i.id===r.ingredient_id});if(ing){h+='<div class="rcp-row"><span style="flex:1;font-size:12px">'+ing.name+'</span><span style="font-size:10px;color:var(--dim);width:25px">'+ing.unit+'</span><button class="btn-d" style="padding:2px 6px;font-size:10px" onclick="delRcp('+r.id+','+id+')">×</button></div>'}})}h+='</div>';h+='<div style="background:var(--bg);border-radius:8px;padding:10px"><div style="font-size:11px;font-weight:600;color:var(--dim);margin-bottom:6px">Tambah Bahan:</div><div style="display:flex;gap:4px"><select id="newRcpIng" style="flex:1;padding:6px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;font-size:12px">';ings.forEach(function(ing){var ex=ir.find(function(r){return r.ingredient_id===ing.id});if(!ex){h+='<option value="'+ing.id+'">'+ing.name+' ('+ing.stock+' '+ing.unit+')</option>'}});h+='</select><input type="number" id="newRcpQty" placeholder="Qty" style="width:60px;padding:6px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;font-size:12px;text-align:center"><button class="btn-p" style="flex:0 0 auto;padding:6px 10px" onclick="addRcp('+id+')">+</button></div></div>';h+='<div style="margin-top:10px;padding:8px;background:#fff4e0;border-radius:6px;font-size:11px;color:var(--gold)">💡 Minuman: Cup + bahan utama. Makanan: Food Box + Tissue.</div>';h+='<div class="m-actions"><button class="btn-s" onclick="closeM(\'recipeModal\')">Tutup</button></div></div>';document.getElementById('recipeContent').innerHTML=h;document.getElementById('recipeModal').classList.add('show')})}
function addRcp(id){var ingId=parseInt(document.getElementById('newRcpIng').value);var q=parseFloat(document.getElementById('newRcpQty').value);if(!q||q<=0){toast('Isi qty',true);return}apiP('recipes',{menu_item_id:id,ingredient_id:ingId,quantity:q}).then(function(r){if(r&&r.error){toast('Error',true);return}toast('Bahan ditambah');editRecipe(id)})}
function delRcp(rid,mid){apiD('recipes/'+rid).then(function(r){if(r&&r.error){toast('Error',true);return}toast('Bahan dihapus');editRecipe(mid)})}

function renderPelanggan(){

// LAPORAN
function renderLaporan(){
  var today=new Date().toISOString().slice(0,10);var weekAgo=new Date(Date.now()-7*86400000).toISOString().slice(0,10);
  document.getElementById('content').innerHTML='<div class="rpt-container"><h2 style="font-size:20px;font-weight:700;margin-bottom:16px">📈 Laporan</h2><div class="date-flt"><label style="font-size:12px">Dari:</label><input type="date" id="dtFrom" value="'+weekAgo+'"><label style="font-size:12px">Sampai:</label><input type="date" id="dtTo" value="'+today+'"><button onclick="loadRpt()">🔄 Refresh</button></div><div class="rpt-cards" id="rptCards"><div class="rpt-card"><div class="lbl">Loading</div><div class="val">...</div></div></div><div id="topItems"></div><h3 style="margin:16px 0 8px;font-size:14px">Riwayat Transaksi</h3><div class="trans-tbl" id="transTbl">Loading...</div></div>';
  loadRpt();
}
function loadRpt(){
  var from=document.getElementById('dtFrom').value;var to=document.getElementById('dtTo').value;
  // Hitung dari localOrders
  var filtered=localOrders.filter(function(o){var d=o.order.created_at?o.order.created_at.slice(0,10):today;if((!from||d>=from)&&(!to||d<=to))return o});
  var totalSales=filtered.reduce(function(s,o){return s+parseFloat(o.order.total||0)},0);
  var dineIn=filtered.filter(function(o){return o.order.order_type==='dine-in'}).length;
  var takeaway=filtered.filter(function(o){return o.order.order_type==='takeaway'}).length;
  
  document.getElementById('rptCards').innerHTML='<div class="rpt-card"><div class="lbl">💰 Total Penjualan</div><div class="val">'+rp(totalSales)+'</div><div class="sub">'+filtered.length+' transaksi</div></div><div class="rpt-card"><div class="lbl">🍽️ Dine-in</div><div class="val">'+dineIn+'</div><div class="sub">order</div></div><div class="rpt-card"><div class="lbl">🥡 Takeaway</div><div class="val">'+takeaway+'</div><div class="sub">order</div></div><div class="rpt-card"><div class="lbl">📈 Rata-rata</div><div class="val">'+rp(filtered.length?totalSales/filtered.length:0)+'</div><div class="sub">per transaksi</div></div>';
  
  if(!filtered.length){document.getElementById('transTbl').innerHTML='<div style="padding:20px;text-align:center;color:var(--dim)">Belum ada transaksi</div>';return}
  document.getElementById('transTbl').innerHTML='<table><thead><tr><th>No. Order</th><th>Waktu</th><th>Tipe</th><th>Items</th><th>Total</th><th>Bayar</th></tr></thead><tbody>'+filtered.reverse().map(function(o){return'<tr><td style="font-weight:600">'+o.order_number+'</td><td>'+new Date(o.order.created_at||Date.now()).toLocaleString('id-ID')+'</td><td><span class="badge '+(o.order.order_type==='dine-in'?'dine':'take')+'">'+(o.order.order_type==='dine-in'?'Dine-in':'Takeaway')+'</span></td><td>'+(o.items?o.items.length:0)+'</td><td style="color:var(--accent);font-weight:700">'+rp(o.order.total)+'</td><td>'+(o.order.payment_method||'cash').toUpperCase()+'</td></tr>'}).join('')+'</tbody></table>';
  
  // Try API data
  if(apiOnline){
    apiG('dashboard?from='+from+'&to='+to).then(function(d){
      if(d&&!d.error){
        var c=document.querySelectorAll('.rpt-card .val');
        if(c[0])c[0].textContent=rp(d.totalSales||0);
        if(c[1])c[1].textContent=d.dineInCount||0;
        if(c[2])c[2].textContent=d.takeawayCount||0;
        if(c[3])c[3].textContent=rp(d.totalOrders?d.totalSales/d.totalOrders:0);
      }
    });
    apiG('transactions?from='+from+'&to='+to).then(function(trans){
      if(trans&&!trans.error&&Array.isArray(trans)&&trans.length){
        document.getElementById('transTbl').innerHTML='<table><thead><tr><th>No. Order</th><th>Waktu</th><th>Tipe</th><th>Items</th><th>Total</th><th>Bayar</th></tr></thead><tbody>'+trans.map(function(o){return'<tr><td style="font-weight:600">'+o.order_number+'</td><td>'+new Date(o.created_at).toLocaleString('id-ID')+'</td><td><span class="badge '+(o.order_type==='dine-in'?'dine':'take')+'">'+(o.order_type==='dine-in'?'Dine-in':'Takeaway')+'</span></td><td>'+(o.order_items?o.order_items.length:0)+'</td><td style="color:var(--accent);font-weight:700">'+rp(o.total)+'</td><td>'+(o.payment_method||'cash').toUpperCase()+'</td></tr>'}).join('')+'</tbody></table>';
      }
    });
  }
}

// SETTINGS
function renderSettings(){
  document.getElementById('content').innerHTML='<div class="set-container"><h2 style="font-size:20px;font-weight:700;margin-bottom:16px">⚙️ Pengaturan</h2><div class="set-section"><h3>🏪 Informasi Toko</h3><div class="fg"><label>Nama Toko</label><input type="text" id="sName" value="'+(settings.store_name||'')+'"></div><div class="fg"><label>Logo (1 huruf)</label><input type="text" id="sLogo" value="'+(settings.store_logo||'')+'" maxlength="2" style="text-transform:uppercase"></div><div class="fg"><label>Alamat</label><textarea id="sAddr" rows="2">'+(settings.store_address||'')+'</textarea></div><div class="fr"><div class="fg"><label>Telepon</label><input type="text" id="sPhone" value="'+(settings.store_phone||'')+'"></div><div class="fg"><label>Email</label><input type="text" id="sEmail" value="'+(settings.store_email||'')+'"></div></div></div><div class="set-section"><h3>💰 Pajak</h3><div class="fg"><label>Rate Pajak (%)</label><input type="number" id="sTax" value="'+(parseFloat(settings.tax_rate||0.10)*100).toFixed(1)+'" step="0.5"></div></div><div class="set-section"><h3>🖨️ Print</h3><div class="fg"><label>Lebar Kertas</label><select id="sPw"><option value="58" '+(settings.print_width==58?'selected':'')+'>58mm</option><option value="80" '+(settings.print_width==80||!settings.print_width?'selected':'')+'>80mm</option></select></div><div class="fg"><label>Footer Struk</label><input type="text" id="sFoot" value="'+(settings.receipt_footer||'')+'"></div><div class="fg"><label><input type="checkbox" id="sAuto" '+(settings.auto_print?'checked':'')+'> Auto-print setelah bayar</label></div></div><button class="set-save" onclick="saveSet()">💾 Simpan</button></div>';
}
function saveSet(){
  settings.store_name=document.getElementById('sName').value.trim()||'MASU SPACE';
  settings.store_logo=document.getElementById('sLogo').value.trim()||'M';
  settings.store_address=document.getElementById('sAddr').value.trim();
  settings.store_phone=document.getElementById('sPhone').value.trim();
  settings.store_email=document.getElementById('sEmail').value.trim();
  settings.tax_rate=parseFloat(document.getElementById('sTax').value)/100;
  settings.print_width=parseInt(document.getElementById('sPw').value);
  settings.receipt_footer=document.getElementById('sFoot').value.trim();
  settings.auto_print=document.getElementById('sAuto').checked;
  localStorage.setItem('pos_settings',JSON.stringify(settings));
  applySettings();toast('Tersimpan');apiU('settings',settings).catch(function(){});
  render();
}

init();
